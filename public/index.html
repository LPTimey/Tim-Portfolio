<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        const lang = navigator.language || navigator.userLanguage;
        const target = lang.startsWith('de') ? './de-DE/' : './en-GB/';

        // Sofort weiterleiten
        window.location.href = target;

        // Auch den Link im Body setzen
        window.onload = () => {
            const link = document.getElementById('redirect-link');
            if (link) {
                link.href = target;
                link.textContent = "click here";
                link.removeAttribute("hidden")
            }
        };
    </script>
</head>

<body>
    <p>If you are not redirected automatically, <a id="redirect-link" href="#" hidden>click here</a>.</p>
    <noscript>
        <p>JavaScript is disabled. <a href="./de-DE/">Click here</a>.</p>
    </noscript>
</body>

</html>
